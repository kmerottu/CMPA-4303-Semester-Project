<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hawk Eye Photography</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        text-align: center;
    }

    header {
        background: #222;
        color: white;
        padding: 20px;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin: 0 10px;
    }

    .filters {
        margin: 20px;
    }

    .filters button {
        padding: 10px 20px;
        margin: 5px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: white;
        transition: 0.3s;
    }

    .filters button:hover {
        background: #444;
        color: white;
    }

    .filters button.active {
        background: #222;
        color: white;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 20px;
        max-width: 1100px;
        margin: auto;
    }

    .gallery-item {
        background: white;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        transition: 0.3s;
    }

    .gallery-item:hover {
        transform: translateY(-5px);
    }

    .gallery-item img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    .gallery-item img:hover {
        transform: scale(1.03);
    }

    .stars {
        margin-top: 10px;
        font-size: 28px;
        cursor: pointer;
        user-select: none;
    }

    .star {
        color: #ccc;
        transition: 0.2s;
    }

    .star.active {
        color: gold;
    }

    .rating-text {
        margin-top: 8px;
        font-size: 14px;
    }

    /* LIGHTBOX */

    .lightbox {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.9);
        justify-content: center;
        align-items: center;
    }

    .lightbox img {
        max-width: 80%;
        max-height: 80%;
        border-radius: 12px;
    }

    .close {
        position: absolute;
        top: 20px;
        right: 40px;
        font-size: 40px;
        color: white;
        cursor: pointer;
    }
    #lightbox {
    display: none;
    position: fixed;
    z-index: 9999;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
}

#lightbox-image {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

#close {
    position: absolute;
    top: 20px;
    right: 40px;
    color: white;
    font-size: 50px;
    cursor: pointer;
}

.gallery-item img {
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    <h1>Hawk Eye Photography</h1>

    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a> |
        <a href="#">Gallery</a>
    </nav>
</header>

<div class="filters">
    <button class="active" onclick="filterImages('all', this)">All</button>
    <button onclick="filterImages('astro', this)">Astro Photography</button>
    <button onclick="filterImages('marching', this)">Marching Band</button>
    <button onclick="filterImages('landscape', this)">Landscape</button>
</div>

<div class="gallery">

    <div class="gallery-item astro">
        <img src="images/photo1.jpg" alt="Astro Photography">
        <div class="stars" data-id="1"></div>
        <p class="rating-text" id="rating-1">No rating yet</p>
    </div>

    <div class="gallery-item marching">
        <img src="images/photo2.jpg" alt="Marching Band">
        <div class="stars" data-id="2"></div>
        <p class="rating-text" id="rating-2">No rating yet</p>
    </div>

    <div class="gallery-item landscape">
        <img src="images/photo3.jpg" alt="Landscape">
        <div class="stars" data-id="3"></div>
        <p class="rating-text" id="rating-3">No rating yet</p>
    </div>

    <div class="gallery-item astro">
        <img src="images/photo4.jpg" alt="Astro Photography">
        <div class="stars" data-id="4"></div>
        <p class="rating-text" id="rating-4">No rating yet</p>
    </div>

    <div class="gallery-item marching">
        <img src="images/photo5.jpg" alt="Marching Band">
        <div class="stars" data-id="5"></div>
        <p class="rating-text" id="rating-5">No rating yet</p>
    </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <span class="close" id="closeBtn">&times;</span>
    <img id="lightboxImg">
</div>

<script>

    // FILTER IMAGES

    function filterImages(category, btn) {

        let items = document.querySelectorAll(".gallery-item");

        items.forEach(item => {

            if (category === "all" || item.classList.contains(category)) {
                item.style.display = "block";
            } else {
                item.style.display = "none";
            }

        });

        document.querySelectorAll(".filters button").forEach(button => {
            button.classList.remove("active");
        });

        btn.classList.add("active");
    }

    // STAR RATINGS

    const starContainers = document.querySelectorAll(".stars");

    starContainers.forEach(container => {

        const id = container.dataset.id;

        let savedRating =
            Number(localStorage.getItem(`rating-${id}`)) || 0;

        for (let i = 1; i <= 5; i++) {

            const star = document.createElement("span");

            star.innerHTML = "★";
            star.classList.add("star");

            if (i <= savedRating) {
                star.classList.add("active");
            }

            star.addEventListener("click", () => {

                localStorage.setItem(`rating-${id}`, i);

                updateStars(container, i);

                updateText(id, i);

            });

            container.appendChild(star);
        }

        updateText(id, savedRating);

    });

    function updateStars(container, rating) {

        const stars = container.querySelectorAll(".star");

        stars.forEach((star, index) => {

            if (index < rating) {
                star.classList.add("active");
            } else {
                star.classList.remove("active");
            }

        });
    }

    function updateText(id, rating) {

        const text =
            document.getElementById(`rating-${id}`);

        if (rating > 0) {
            text.textContent =
                `Current Rating: ${rating}/5 Stars`;
        } else {
            text.textContent = "No rating yet";
        }

    }

    const galleryImages = document.querySelectorAll(".gallery-item img");

const lightbox = document.getElementById("lightbox");
const lightboxImage = document.getElementById("lightbox-image");
const close = document.getElementById("close");

galleryImages.forEach(image => {

    image.addEventListener("click", () => {

        lightbox.style.display = "flex";

        lightboxImage.src = image.src;

    });

});

close.addEventListener("click", () => {

    lightbox.style.display = "none";

});

lightbox.addEventListener("click", (e) => {

    if (e.target === lightbox) {

        lightbox.style.display = "none";

    }

});

</script>
<div id="lightbox">
    <span id="close">&times;</span>
    <img id="lightbox-image">
</div>
</body>
</html>
